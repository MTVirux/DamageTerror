name: Create Test Release

on:
  push:
    tags:
      - testing_*

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '10.x.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Update potencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path potency-changes | Out-Null
          $captured = & ./update-potencies.ps1 *>&1 | Out-String
          Write-Host $captured
          $dirty = git status --porcelain -- DamageTerror/Jobs/
          if ([string]::IsNullOrWhiteSpace($dirty)) {
            Write-Host "No potency changes detected; skipping summary."
          } else {
            $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
            $summaryPath = "potency-changes/$stamp-${{ github.ref_name }}.md"
            Set-Content -Path $summaryPath -Encoding utf8 -Value @(
              "# Potency updates for ${{ github.ref_name }}"
              ""
              "Generated: $((Get-Date).ToUniversalTime().ToString('u'))"
              ""
              '```'
              $captured.TrimEnd()
              '```'
            )
            Write-Host "Wrote summary: $summaryPath"
          }
      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
      - name: Build
        run: |
          dotnet build --no-restore --configuration Debug --nologo
      - name: Write testing version into json
        run: |
          $ver = '${{ github.ref_name }}' -replace 'testing_'
          $path = './DamageTerror/bin/Debug/DamageTerror.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          if ($json.PSObject.Properties.Name -contains 'TestingAssemblyVersion') {
            $json.TestingAssemblyVersion = $ver
          } else {
            $json | Add-Member -NotePropertyName 'TestingAssemblyVersion' -NotePropertyValue $ver
          }
          $content = $json | ConvertTo-Json
          set-content -Path $path -Value $content
      - name: Verify manifest matches repo.json
        # Belt-and-suspenders: fail the build now (not at user install time) if AssemblyVersion drifts.
        run: |
          $manifest = Get-Content -Raw './DamageTerror/bin/Debug/DamageTerror.json' | ConvertFrom-Json
          $repo = (Get-Content -Raw './repo.json' | ConvertFrom-Json)[0]
          if ($manifest.AssemblyVersion -ne $repo.AssemblyVersion) {
            Write-Error "Manifest AssemblyVersion ($($manifest.AssemblyVersion)) does not match repo.json AssemblyVersion ($($repo.AssemblyVersion)). Dalamud will reject the install."
            exit 1
          }
          $expectedTesting = '${{ github.ref_name }}' -replace 'testing_'
          if ($manifest.TestingAssemblyVersion -ne $expectedTesting) {
            Write-Error "Manifest TestingAssemblyVersion ($($manifest.TestingAssemblyVersion)) does not match tag version ($expectedTesting)."
            exit 1
          }
      - name: Archive
        run: Compress-Archive -Path DamageTerror/bin/Debug/* -DestinationPath DamageTerror.zip
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./DamageTerror/bin/Debug/*
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: DamageTerror ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./DamageTerror.zip
          asset_name: DamageTerror.zip
          asset_content_type: application/zip

      - name: Write out repo.json
        run: |
          $verT = '${{ github.ref_name }}'
          $ver = $verT -replace 'testing_'
          $path = './repo.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json[0].TestingAssemblyVersion = $ver
          $json[0].LastUpdate = [int][double]::Parse((Get-Date -UFormat %s))
          $json[0].DownloadLinkTesting = $json.DownloadLinkTesting -replace '[^/]+/DamageTerror.zip',"$verT/DamageTerror.zip"
          $content = $json | ConvertTo-Json -AsArray
          set-content -Path $path -Value $content

      - name: Commit potency updates and repo.json
        shell: pwsh
        run: |
          git config --global user.name "Actions User"
          git config --global user.email "actions@github.com"
          git fetch origin master
          git branch -f master ${{ github.sha }}
          git checkout master
          # The .cs edits from "Update potencies" survive this checkout because on a tag
          # push HEAD == ${{ github.sha }}, so the target tree is identical and the dirty
          # working-tree files are not clobbered. Do not reorder steps such that this
          # invariant breaks.
          git add DamageTerror/Jobs potency-changes
          git commit -m "[CI] Update potencies for ${{ github.ref_name }}" || true
          git add repo.json
          git commit -m "[CI] Updating repo.json for ${{ github.ref_name }}" || true
          git push origin master
